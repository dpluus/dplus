<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> D Plus </title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(140deg, #050505, #101018, #050505);
  background-size: 300% 300%;
  animation: bgMove 12s ease infinite;
  color: #fff;
}

@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

header {
  text-align: center;
  padding: 32px 10px;
  font-size: 34px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #00eaff;
  text-shadow: 0 0 12px #00eaff;
}

.grid {
  display: grid;
  gap: 22px;
  padding: 30px;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}

.card {
  padding: 28px 20px;
  border-radius: 16px;
  text-align: center;
  font-size: 22px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  color: #fff;
  border: 2px solid rgba(0,255,255,0.35);
  background: rgba(0, 30, 40, 0.25);
  text-shadow: 0 0 8px rgba(0,255,255,0.75);
  box-shadow: 0 0 14px rgba(0,255,255,0.25);
  transition: 0.25s;
  position: relative;
  overflow: hidden;
}

.card:hover {
  transform: translateY(-8px) scale(1.03);
  border-color: #00eaff;
  box-shadow: 0 0 22px rgba(0,255,255,0.75);
}

footer {
  text-align: center;
  padding: 20px;
  opacity: 0.65;
  font-size: 15px;
  letter-spacing: 1px;
}

/* Popup */
.popup-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.popup-box {
  background: #061018;
  padding: 26px 35px;
  border-radius: 14px;
  text-align: center;
  border: 2px solid #00eaff;
  box-shadow: 0 0 22px rgba(0,255,255,0.6);
  max-width: 320px;
}

.popup-box h2 {
  font-size: 20px;
  margin-bottom: 14px;
  color: #00eaff;
}

.popup-btn {
  margin-top: 18px;
  padding: 10px 22px;
  background: #00eaff;
  border: none;
  color: #000;
  font-size: 15px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}
</style>
</head>

<body>
<header> D+  Sports </header>

<div class="grid" id="playlistContainer"></div>

<!-- Popup -->
<div class="popup-overlay" id="popup">
  <div class="popup-box">
    <h2>Join Our Telegram Channel</h2>
    <p>Get exclusive content, updates, and premium streams directly in Telegram !</p>
    <button class="popup-btn" onclick="closePopup()">OK</button>
  </div>
</div>

<script>
const playlists = [
  { name: "Football ⚽", url: "go:fbl" },
  { name: "Cricket 🏏", url: "go:cri" },
  { name: " Star Sports 🌟 ", url: "go:star " },
  { name: "Fancode ‣", url: "go:fan" },
  { name: "Sony LiV ‣ ", url: "go:liv" },
];

const container = document.getElementById("playlistContainer");

playlists.forEach(item => {
  const card = document.createElement("a");
  card.className = "card";
  card.href = item.url;
  card.target = "_blank";
  card.textContent = item.name;
  container.appendChild(card);
});

function closePopup() {
  document.getElementById("popup").style.display = "none";
}
</script>

<footer> @official_mtv </footer>
</body>
</html>
